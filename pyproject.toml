[project]
name = "qlm3d"
version = "0.1.0"
description = "Reference SSE quantum Monte Carlo for the 3+1D U(1) quantum link model on the cubic lattice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.61",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.9", "h5py>=3.11", "pandas>=2.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "plots"]
markers = ["slow: chains on the 4x4x4 lattice (about two minutes)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
src = ["src", "plots", "tests"]

[tool.basedpyright]
extraPaths = ["src", "plots"]
